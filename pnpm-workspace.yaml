# SCRIPTS DE BUILD DAS DEPENDÊNCIAS
# ─────────────────────────────────
# O pnpm bloqueia scripts de instalação por padrão. O esbuild (usado pelo
# tsx e pelo vitest) funciona sem o postinstall, porque o binário vem num
# pacote opcional por plataforma; por isso o script fica negado.
allowBuilds:
  esbuild: false
